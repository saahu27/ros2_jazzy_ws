# Controller configuration for MoveIt constrained motion planning
# 
# Optimized for OMPL constraint-based planning with MoveIt2:
# - High update rate (1000Hz) for smooth motion and minimal tracking lag
# - Velocity feedforward for accurate trajectory tracking
# - High PID gains matching controller_trapezoidal.yaml for stable control
# - Spline interpolation for smooth motion between MoveIt waypoints
#
# NOTE: Requires use_velocity_interface:=true in the xacro for velocity
# command/state interfaces to be available.
#
# Usage in launch file:
#   controller_config:=controller_constrained.yaml
#   use_velocity_interface:=true
#   position_gain:=1000.0

controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz - 1kHz for minimal tracking lag (same as trapezoidal)

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    # Spline interpolation for smooth motion between MoveIt waypoints
    # (MoveIt generates fewer waypoints than our trapezoidal trajectory generator)
    interpolation_method: "splines"
    
    joints:
      - lift_joint
      - j1
      - j2
      - j3
      - j4
      - j5
      - j6

    # Position + Velocity for feedforward control (same as trapezoidal)
    command_interfaces:
      - position
      - velocity

    state_interfaces:
      - position
      - velocity

    # Closed-loop control for accurate trajectory tracking
    open_loop_control: false
    allow_integration_in_goal_trajectories: true

    # High PID gains matching controller_trapezoidal.yaml for tight tracking
    # These gains are required for smooth, non-wobbling motion in Gazebo
    gains:
      lift_joint:
        p: 10000.0
        i: 500.0
        d: 500.0
        ff_velocity_scale: 1.0
      j1:
        p: 8000.0
        i: 200.0
        d: 400.0
        ff_velocity_scale: 1.0
      j2:
        p: 8000.0
        i: 200.0
        d: 400.0
        ff_velocity_scale: 1.0
      j3:
        p: 8000.0
        i: 200.0
        d: 400.0
        ff_velocity_scale: 1.0
      j4:
        p: 5000.0
        i: 100.0
        d: 250.0
        ff_velocity_scale: 1.0
      j5:
        p: 5000.0
        i: 100.0
        d: 250.0
        ff_velocity_scale: 1.0
      j6:
        p: 5000.0
        i: 100.0
        d: 250.0
        ff_velocity_scale: 1.0
