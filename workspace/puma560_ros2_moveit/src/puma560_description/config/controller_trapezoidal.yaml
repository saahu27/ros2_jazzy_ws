controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz - 1kHz for minimal tracking lag

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    # Disable spline interpolation to preserve trapezoidal velocity profile
    # With "none", controller steps directly between trajectory points
    # Requires high trajectory density (dt <= 0.005s) for smooth motion
    interpolation_method: "none"
    
    joints:
      - lift_joint
      - j1
      - j2
      - j3
      - j4
      - j5
      - j6

    command_interfaces:
      - position
      - velocity  # Feedforward velocity for better trapezoidal profile tracking

    state_interfaces:
      - position
      - velocity  # Velocity feedback for closed-loop control

    # Use closed-loop control with velocity feedforward for tight tracking
    open_loop_control: false
    allow_integration_in_goal_trajectories: true

    # PID gains for tight trajectory tracking (trapezoidal velocity profiles)
    # Very high gains for minimal tracking error - required for trapezoidal profile fidelity
    gains:
      lift_joint:
        p: 10000.0
        i: 500.0
        d: 500.0
        ff_velocity_scale: 1.0
      j1:
        p: 8000.0
        i: 200.0
        d: 400.0
        ff_velocity_scale: 1.0
      j2:
        p: 8000.0
        i: 200.0
        d: 400.0
        ff_velocity_scale: 1.0
      j3:
        p: 8000.0
        i: 200.0
        d: 400.0
        ff_velocity_scale: 1.0
      j4:
        p: 5000.0
        i: 100.0
        d: 250.0
        ff_velocity_scale: 1.0
      j5:
        p: 5000.0
        i: 100.0
        d: 250.0
        ff_velocity_scale: 1.0
      j6:
        p: 5000.0
        i: 100.0
        d: 250.0
        ff_velocity_scale: 1.0
